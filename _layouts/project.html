---
layout: default
---
<article class="prose page-content project-page">
  <a class="back-link" href="{{ '/projects/' | relative_url }}">← 全部项目</a>
  <p class="eyebrow">PROJECT · {{ page.repository }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.status %}<p class="project-status">{{ page.status }}</p>{% endif %}
  {{ content }}
  {% if page.source_url %}<p><a class="text-link" href="{{ page.source_url }}">查看源代码 <span aria-hidden="true">↗</span></a></p>{% endif %}
</article>
