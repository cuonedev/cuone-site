<text x="462" y="329" font-size="18" fill="#777">信息靠人传递</text>

<path d="M654 205 Q657 196 669 198 L862 198 Q874 199 874 211 L874 352 Q872 362 860 362 L666 362 Q654 360 654 349Z" fill="#fff" stroke="#258148" stroke-width="3"/>
<text x="764" y="252" font-size="27" font-weight="700" fill="#258148">编码 Agent</text>
