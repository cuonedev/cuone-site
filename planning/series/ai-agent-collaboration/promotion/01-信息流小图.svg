<rect width="900" height="600" rx="20" fill="#fffdf6"/>
<text x="450" y="75" text-anchor="middle" font-family="KaiTi,STKaiti,Microsoft YaHei,sans-serif" font-size="43" font-weight="700" fill="#222">多个 AI Agent 如何协作？</text>
<path d="M95 97 Q450 103 805 96" fill="none" stroke="#333" stroke-width="3"/>
