<text x="160" y="295" font-size="21" fill="#444">整理方案与背景</text>
<text x="160" y="329" font-size="18" fill="#777">完成一个环节</text>

<path d="M352 205 Q355 196 367 198 L560 198 Q572 199 572 211 L572 352 Q570 362 558 362 L364 362 Q352 360 352 349Z" fill="#fff" stroke="#c5412e" stroke-width="3"/>
