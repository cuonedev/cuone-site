<g font-family="KaiTi,STKaiti,Microsoft YaHei,sans-serif" text-anchor="middle">
<path d="M50 205 Q53 196 65 198 L258 198 Q270 199 270 211 L270 352 Q268 362 256 362 L62 362 Q50 360 50 349Z" fill="#fff" stroke="#245ba8" stroke-width="3"/>
