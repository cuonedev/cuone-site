<text x="764" y="329" font-size="18" fill="#777">再开始下个环节</text>

<path d="M277 279 L339 279" fill="none" stroke="#c5412e" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><use href="#arrow" x="339" y="279" color="#c5412e"/>
<path d="M579 279 L641 279" fill="none" stroke="#c5412e" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><use href="#arrow" x="641" y="279" color="#c5412e"/>
<text x="308" y="250" font-size="16" fill="#c5412e">写下来</text>
