<path d="M116 421 Q119 412 131 414 L769 414 Q781 415 781 427 L781 500 Q779 510 767 510 L128 510 Q116 508 116 497Z" fill="#fff7ee" stroke="#d44a31" stroke-width="2.5"/>
<text x="450" y="459" font-size="28" font-weight="700" fill="#c5412e">Agent 能分工，沟通为什么还靠人？</text>
<text x="450" y="490" font-size="18" fill="#555">一篇关于多 Agent 互联协作的实践观察</text>
